name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-24.04
    # The app needs GTK 4.16+ and libadwaita 1.6+, so use Debian 13 like the
    # release build instead of the older Ubuntu 24.04 toolkit.
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libadwaita-1-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libssl-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  packaging:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packaging tools
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            appstream desktop-file-utils python3-yaml

      - uses: actions/checkout@v4

      - name: AppStream metadata
        run: appstreamcli validate --no-net --pedantic packaging/io.github.tibssy.Imagiflume.metainfo.xml

      - name: Desktop entry
        run: desktop-file-validate packaging/io.github.tibssy.Imagiflume.desktop

      - name: Flatpak manifests
        run: |
          python3 - <<'PY'
          import yaml

          manifests = {}
          for name in (
              "packaging/flatpak/io.github.tibssy.Imagiflume.yml",
              "packaging/flatpak/io.github.tibssy.Imagiflume.local.yml",
          ):
              with open(name) as handle:
                  manifest = yaml.safe_load(handle)
              assert manifest["id"] == "io.github.tibssy.Imagiflume", name
              assert manifest["command"] == "imagiflume", name
              assert manifest["sdk-extensions"] == [
                  "org.freedesktop.Sdk.Extension.rust-stable"
              ], name
              modules = [module["name"] for module in manifest["modules"]]
              assert modules == [
                  "stable-diffusion-cpp",
                  "llama-cpp",
                  "imagiflume",
              ], f"{name}: {modules}"
              manifests[name] = (manifest["runtime"], manifest["runtime-version"])
              print(f"{name}: ok")
          assert len(set(manifests.values())) == 1, manifests
          PY
